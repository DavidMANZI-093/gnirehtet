[package]
name = "gnirehtet"
version = "2.6.0"
authors = [
  "Romain Vimont <rom@rom1v.com>",
  "David MANZI <manzidavid093@gmail.com>",  # simply active maintainer
]
edition = "2024"

[dependencies]
# for atomic log level filter
atomic_enum = { version = "0.3.0", default-features = false }

# for formatting timestamp in logs
chrono = { version = "0.4.45", default-features = false, features = ["clock"] } 

# for command-line parsing
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions", "wrap_help"] } 

# for handling Ctrl+C
ctrlc = { version = "3.5.2", default-features = false, features = ["termination"] } 

# for random TCP sequence number# for random TCP sequence number
getrandom = { version = "0.4.3", default-features = false } 

# for async I/O
mio = { version = "1.2.4", default-features = false, features = ["net", "os-poll"] } 

# helper for mio Tokens
slab = { version = "0.4", default-features = false }

[profile.release]
opt-level = "z"      # optimize for binary size (loop vecotirzation off)
lto = "thin"         # link-time optimization - thin (less time)
codegen-units = 1    # parallel codegenerating units (more may produce slower code)
strip = "symbols"    # strip 'symbols' from binary
debug = false        # no debug info in compiled binary
panic = "unwind"     # unwind the stack upon panic

[profile.dist]
inherits = "release" 
opt-level = "z"      # optimize for binary size (loop vecotirzation off)
lto = "true"         # link-time optimization (fat - see, https://doc.rust-lang.org/cargo/reference/profiles.html#lto)
codegen-units = 1    # parallel codegenerating units (more may produce slower code)
strip = "symbols"    # strip 'symbols' from binary
debug = false        # no debug info in compiled binary
panic = "abort"      # terminate process upon panic
